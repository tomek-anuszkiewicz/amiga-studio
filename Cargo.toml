[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/copper",
    "crates/blitter",
    "crates/dma",
    "crates/agnus",
    "crates/sprites",
    "crates/frame_builder",
    "crates/mouse",
    "crates/joystick",
    "crates/denise",
    "crates/audio",
    "crates/floppy",
    "crates/interrupts",
    "crates/paula",
    "crates/keyboard",
    "crates/cia",
    "crates/machine_loop",
    "crates/rtc",
    "crates/physical_memory",
    "crates/memory_bus",
    "crates/cpu",
    "crates/disassembler",
    "crates/debugger",
    "crates/gui",
    "crates/game_ports",
    "crates/test_runner",
    "tools/blep_generator",
]
default-members = ["crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Amiga Emulator Project"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
bitflags = "2.4"
flate2 = "1.0"
config = { path = "crates/config" }
copper = { path = "crates/copper" }
blitter = { path = "crates/blitter" }
dma = { path = "crates/dma" }
agnus = { path = "crates/agnus" }
sprites = { path = "crates/sprites" }
frame_builder = { path = "crates/frame_builder" }
mouse = { path = "crates/mouse" }
joystick = { path = "crates/joystick" }
denise = { path = "crates/denise" }
audio = { path = "crates/audio" }
floppy = { path = "crates/floppy" }
interrupts = { path = "crates/interrupts" }
paula = { path = "crates/paula" }
keyboard = { path = "crates/keyboard" }
cia = { path = "crates/cia" }
machine_loop = { path = "crates/machine_loop" }
rtc = { path = "crates/rtc" }
physical_memory = { path = "crates/physical_memory" }
memory_bus = { path = "crates/memory_bus" }
cpu = { path = "crates/cpu" }
disassembler = { path = "crates/disassembler" }
debugger = { path = "crates/debugger" }
game_ports = { path = "crates/game_ports" }

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
deprecated = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
correctness = { level = "deny", priority = -1 }
# Zero host panics on guest code (strictly denied in production code; tests exempt via #![allow(...)])
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"

# Architectural integrity & disallowed abstractions
disallowed_types = "deny"
disallowed_methods = "deny"

# Memory, ownership and borrowing
ptr_arg = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
box_collection = "deny"
vec_box = "deny"
transmute_ptr_to_ptr = "deny"
cast_ptr_alignment = "deny"

# Trait derives and constructors
new_without_default = "deny"
new_ret_no_self = "deny"
expl_impl_clone_on_copy = "deny"
derivable_impls = "deny"

# Visibility and re-exports
redundant_pub_crate = "deny"
wildcard_imports = "deny"

# Control flow, boolean logic and performance
nonminimal_bool = "deny"
needless_bool = "deny"
or_fun_call = "deny"

# Disabled - harmful in emulator or obscures physical hardware architecture
cast_possible_truncation = "allow"
match_same_arms = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"

# Project-specific override: hot ALU and CCR routines require #[inline(always)]
inline_always = "allow"

[profile.test]
opt-level = 0
