[workspace]
resolver = "2"
members = [
    "crates/memory_bus",
    "crates/m68000",
    "crates/debugger",
    "crates/test_runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Amiga Emulator Project"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
bitflags = "2.4"
flate2 = "1.0"
memory_bus = { path = "crates/memory_bus" }
m68000 = { path = "crates/m68000" }
debugger = { path = "crates/debugger" }

[profile.test]
opt-level = 2
