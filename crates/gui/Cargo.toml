[package]
name = "gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "amiga-studio"

[lib]
path = "src/gui.rs"
crate-type = ["cdylib", "rlib"]

[features]
game-fps-benchmark = []

[[bin]]
name = "amiga-studio"
path = "src/main.rs"

[[bin]]
name = "gui-inspector"
path = "src/bin/gui_inspector.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "persistence", "wayland", "web_screen_reader", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
config = { path = "../config" }
rtc = { path = "../rtc" }
physical_memory = { path = "../physical_memory" }
cpu = { path = "../cpu" }
debugger = { workspace = true }
keyboard = { path = "../keyboard" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "0.25.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
async-channel = "2.5"
blocking = "1.7"
notify = "9.0"
winit = "0.30"
gilrs = "0.11.2"
rfd = "0.18"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { workspace = true, features = ["jpeg"] }
tempfile = "3.27"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Globalization_DateTimeFormatting", "Win32_Devices_HumanInterfaceDevice", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString", "NSTimeZone"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window", "HtmlInputElement", "HtmlAnchorElement", "File", "FileSystemFileHandle", "FileList", "Blob", "Url", "Event", "Worker"] }

[lints]
workspace = true
