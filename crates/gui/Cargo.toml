[package]
name = "gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "amiga-studio"

[lib]
path = "src/gui.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "amiga-studio"
path = "src/main.rs"

[[bin]]
name = "gui-inspector"
path = "src/bin/gui_inspector.rs"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["persistence"] }
egui = { version = "0.31", default-features = true }
config = { path = "../config" }
rtc = { path = "../rtc" }
physical_memory = { path = "../physical_memory" }
m68000 = { path = "../m68000" }
debugger = { path = "../debugger" }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
