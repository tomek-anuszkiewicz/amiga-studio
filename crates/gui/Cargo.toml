[package]
name = "gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "amiga-studio"

[lib]
path = "src/gui.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "amiga-studio"
path = "src/main.rs"

[[bin]]
name = "gui-inspector"
path = "src/bin/gui_inspector.rs"

[dependencies]
eframe = { version = "0.32", default-features = true, features = ["persistence"] }
egui = { version = "0.32", default-features = true }
config = { path = "../config" }
rtc = { path = "../rtc" }
physical_memory = { path = "../physical_memory" }
cpu = { path = "../cpu" }
debugger = { workspace = true }
keyboard = { path = "../keyboard" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
winit = "0.30"
gilrs = "0.11.2"
rfd = "0.15"
egui_kittest = { version = "0.32", features = ["wgpu", "snapshot"] }
image = { workspace = true, features = ["jpeg"] }
tempfile = "3.27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window", "HtmlInputElement", "HtmlAnchorElement", "File", "FileList", "Blob", "Url", "Event", "Worker"] }

[lints]
workspace = true
