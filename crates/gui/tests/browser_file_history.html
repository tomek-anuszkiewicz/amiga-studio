<!doctype html>
<meta charset="utf-8">
<title>Browser file history checks</title>
<pre id="result">Running</pre>
<script type="module">
// Serve the repository over localhost and open this page in an isolated browser profile.
// Real IndexedDB and file handles exercise persistence; picker calls are simulated.
const result = document.getElementById("result");
function check(condition, message) {
    if (!condition) throw new Error(message);
}
try {
    const directory = await navigator.storage.getDirectory();
    const oldProgram = await directory.getFileHandle("legacy-program.bin", { create: true });
    const rom = await directory.getFileHandle("firmware.rom", { create: true });
    const db = await new Promise((resolve, reject) => {
        const request = indexedDB.open("amiga-file-history", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("history");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
    await new Promise((resolve, reject) => {
        const write = db.transaction("history", "readwrite");
        write.objectStore("history").put({
            binary: [{ name: oldProgram.name, handle: oldProgram }],
            rom: [{ name: rom.name, handle: rom }],
        }, "files");
        write.oncomplete = resolve;
        write.onerror = () => reject(write.error);
    });
    const files = await import("../src/file_actions/browser_files.js");
    await files.restore_history();
    check(files.recent_rom_names().join() === rom.name, "Previously selected ROM must be restored");
    const persisted = await new Promise((resolve, reject) => {
        const request = db.transaction("history", "readonly").objectStore("history").get("files");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
    db.close();
    check(Object.keys(persisted).join() === "rom", "Retired program history must be removed from IndexedDB");
    check(await persisted.rom[0].handle.isSameEntry(rom), "Cleanup must preserve the original ROM handle");

    const handles = [];
    for (let index = 0; index < 6; index++) {
        const handle = await directory.getFileHandle(`firmware-${index}.rom`, { create: true });
        handles.push(handle);
        await files.remember_rom(handle.name, handle);
    }
    check(JSON.stringify(files.recent_rom_names()) === JSON.stringify([
        "firmware-5.rom", "firmware-4.rom", "firmware-3.rom", "firmware-2.rom", "firmware-1.rom",
    ]), "Five most recent ROMs must be retained in order");
    await files.remember_rom(handles[2].name, handles[2]);
    check(files.recent_rom_names().length === 5, "Reopening must not add a duplicate");
    check(files.recent_rom_names()[0] === handles[2].name, "Reopened file must move to the front");

    // A fresh module has no in-memory history and must reconstruct structured file handles.
    const restored = await import("../src/file_actions/browser_files.js?restored");
    await restored.restore_history();
    check(JSON.stringify(restored.recent_rom_names()) === JSON.stringify(files.recent_rom_names()), "ROM history must survive reinitialization");
    let options;
    window.showOpenFilePicker = settings => {
        options = settings;
        return Promise.resolve([handles[2]]);
    };
    const selection = restored.pick_file("rom", "Load ROM", [".rom"], 0);
    check(options !== undefined, "Picker must be called synchronously during activation");
    check(options.id === "amiga-rom", "ROM picker needs its own directory ID");
    check(await options.startIn.isSameEntry(handles[2]), "Recent entry must pass its restored file handle as the starting folder");
    check((await selection)[0].name === handles[2].name, "Selected file must be returned");
    await restored.pick_file("rom", "Load ROM", [".rom"], -1);
    check(options.id === "amiga-rom" && !options.startIn, "ROM picker must use its separate remembered directory");
    check(options.types[0].accept["application/octet-stream"][0] === ".rom", "File filter must follow the selected category");
    await restored.pick_file("rom", "Load ROM", [".rom"], 0);
    check(await options.startIn.isSameEntry(handles[2]), "Recent ROM must use its own file's folder");

    window.showOpenFilePicker = () => Promise.reject(new DOMException("Canceled", "AbortError"));
    check(await restored.pick_file("rom", "Load ROM", [".rom"], 0) === null, "Cancellation must remain a normal outcome");
    window.showOpenFilePicker = () => Promise.reject(new Error("Read denied"));
    let rejected = false;
    try { await restored.pick_file("rom", "Load ROM", [".rom"], 0); }
    catch (error) { rejected = error.message === "Read denied"; }
    check(rejected, "Picker failures must reach the GUI");

    const notices = [];
    window.alert = message => notices.push(message);
    const missing = await directory.getFileHandle("deleted-file.rom", { create: true });
    await restored.remember_rom(missing.name, missing);
    await directory.removeEntry(missing.name);
    window.showOpenFilePicker = () => Promise.reject(new DOMException("Canceled", "AbortError"));
    check(await restored.pick_file("rom", "Load ROM", [".rom"], 0) === null, "Missing recent file must still allow cancellation");
    check(!restored.recent_rom_names().includes(missing.name), "Missing file must be removed even when the picker is canceled");
    check(notices.length === 1 && notices[0].includes(missing.name), "Missing file needs an explanatory message");

    const removedDirectory = await directory.getDirectoryHandle("removed-folder", { create: true });
    const missingRom = await removedDirectory.getFileHandle("deleted.rom", { create: true });
    await restored.remember_rom(missingRom.name, missingRom);
    await removedDirectory.removeEntry(missingRom.name);
    await directory.removeEntry(removedDirectory.name);
    const pickerCalls = [];
    window.showOpenFilePicker = settings => {
        pickerCalls.push({ ...settings });
        return settings.startIn
            ? Promise.reject(new DOMException("Folder was deleted", "NotFoundError"))
            : Promise.resolve([rom]);
    };
    const replacement = await restored.pick_file("rom", "Load ROM", [".rom"], 0);
    check(pickerCalls.length === 2 && !pickerCalls[1].startIn, "Missing folder must retry with the browser's default location");
    check(replacement[0].name === rom.name, "A selection from the default location must still be returned");
    check(!restored.recent_rom_names().includes(missingRom.name), "Entry in a deleted folder must be removed");
    check(notices.length === 2 && notices[1].includes("recent ROMs"), "Deleted ROM folder needs an explanatory message");
    check(restored.recent_rom_names().includes(handles[2].name), "Other ROM entries must remain");

    const denied = await directory.getFileHandle("denied.rom", { create: true });
    await restored.remember_rom(denied.name, denied);
    denied.getFile = () => Promise.reject(new DOMException("Read denied", "NotAllowedError"));
    window.showOpenFilePicker = () => Promise.reject(new DOMException("Canceled", "AbortError"));
    await restored.pick_file("rom", "Load ROM", [".rom"], 0);
    check(restored.recent_rom_names().includes(denied.name), "Denied access must not delete a recent entry");
    check(notices.length === 2, "Denied access must not be reported as a missing file");
    const afterRemoval = await import("../src/file_actions/browser_files.js?afterRemoval");
    await afterRemoval.restore_history();
    check(!afterRemoval.recent_rom_names().includes(missing.name), "Removal of a missing ROM file must persist");
    check(!afterRemoval.recent_rom_names().includes(missingRom.name), "ROM removal must persist");

    window.showOpenFilePicker = undefined;
    const originalClick = HTMLInputElement.prototype.click;
    HTMLInputElement.prototype.click = function () {
        check(this.accept === ".rom", "Fallback must retain the file filter");
        this.dispatchEvent(new Event("cancel"));
    };
    check(await restored.pick_file("rom", "Load ROM", [".rom"], 0) === null, "Fallback cancellation must resolve");
    check(!document.querySelector("input"), "Fallback input must be removed");
    HTMLInputElement.prototype.click = function () {
        Object.defineProperty(this, "files", { value: [new File(["data"], "fallback.rom")] });
        this.dispatchEvent(new Event("change"));
    };
    const fallback = await restored.pick_file("rom", "Load ROM", [".rom"], -1);
    check(fallback[0].name === "fallback.rom" && fallback[1] === null, "Fallback must return an explicit file without a handle");
    HTMLInputElement.prototype.click = originalClick;
    await restored.remember_rom("fallback.rom", null);
    await restored.remember_rom("fallback.rom", null);
    check(restored.recent_rom_names().filter(name => name === "fallback.rom").length === 1, "Fallback filenames must be deduplicated");
    check(!document.querySelector("input"), "Completed fallback input must be removed");
    result.textContent = "PASS: history limit, ordering, deduplication, retired history cleanup, IndexedDB restoration, starting folders, activation, cancellation, errors, missing files and folders, removal persistence, denied access and fallback";
} catch (error) {
    result.textContent = `FAIL: ${error.stack}`;
}
</script>
