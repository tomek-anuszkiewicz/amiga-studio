# Global configuration for the modular PDF-to-Markdown pipeline
# Preparation ends at Stage 08; book generation is a separate program.

# Shared rendering settings for Stages 01 and 02.
rendering:
  dpi: 300

stages:
  # Stage 01: add a text layer to pages that need OCR.
  01_text_layer:
    traineddata_sha256: "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2"
    traineddata_url: "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata"

llm:
  # Maximum simultaneous page/table requests within one stage invocation.
  concurrency: 1
  post_request_delay_seconds: 60
  stages:
    03_page_conversion: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    05_transform_page_tables: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    08_proofreading: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
