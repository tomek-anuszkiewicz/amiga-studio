# Global configuration for the modular PDF-to-Markdown pipeline
# Stage 02.9 is deterministic: fixed document.md/assets output and exact pixel
# crops. It has no model/effort selection or configurable geometry adjustment.

input:
  source_pdf: null  # Initialize with --pdf; persisted relative to this config.
  pages: null       # All physical pages, or a list initialized by --page-ranges.

render:
  dpi: 300
  image_format: "png"

table_conversion:
  predecessor: "02.8"  # Explicit whole-input alternative: "02" when filtering was deliberately skipped.

table_review:
  browser_channel: "msedge"  # Or "chrome" / installed Playwright "chromium".

ocr:
  language: "eng"
  tessdata: null  # Auto-detect or use TESSDATA_PREFIX; override locally if needed.

llm:
  timeout_seconds: 180
  concurrency: 1
  stages:
    02_page_conversion: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    02.81_transform_page_tables: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    04_stream_reduction: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    06_detect_continuations: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    07_transform_tables: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    08_transform_graphics: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    09_transform_prose: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    10_proofread_stream: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    12_generate_properties: {model: "gpt-6.1-sol", reasoning_effort: "medium"}
    13_refine_first_chapter_name: {model: "gpt-6.1-sol", reasoning_effort: "medium"}

markers:
  toc_start: "<!-- TOC34534 -->"
  toc_end: "<!-- /TOC34534 -->"
