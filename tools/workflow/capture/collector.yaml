extensions:
  bearertokenauth:
    token: ${env:CAPTURE_COLLECTOR_TOKEN}
receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
        auth:
          authenticator: bearertokenauth
exporters:
  file/logs:
    path: /capture/output/logs-*.jsonl
    flush_interval: 100ms
    group_by:
      enabled: true
      resource_attribute: capture.output
  file/traces:
    path: /capture/output/traces-*.jsonl
    flush_interval: 100ms
    group_by:
      enabled: true
      resource_attribute: capture.output
service:
  extensions: [bearertokenauth]
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file/logs]
    traces:
      receivers: [otlp]
      exporters: [file/traces]
