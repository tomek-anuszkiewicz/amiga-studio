# Global configuration for the modular PDF-to-Markdown pipeline

render:
  dpi: 300
  image_format: "png"
  padding_margin_ratio: 0.10  # 10% safety margin on raster fallback crops

paths:
  workspace_dir: "workspace"
  pages_dir: "workspace/01_pages"
  segments_dir: "workspace/02_segments"
  raw_stream_dir: "workspace/03_raw_stream"
  reduced_stream_dir: "workspace/04_reduced_stream"
  assets_dir: "workspace/03_raw_stream/assets"
  chapters_raw_dir: "workspace/05_chapters_raw"
  chapters_continuations_dir: "workspace/06_chapters_continuations"
  chapters_tables_dir: "workspace/07_chapters_tables"
  chapters_graphics_dir: "workspace/08_chapters_graphics"
  chapters_formatted_dir: "workspace/09_chapters_formatted"
  markdown_raw_dir: "workspace/10_markdown_raw"
  markdown_linked_dir: "workspace/11_markdown_linked"
  default_output_dir: "output_markdown"

llm:
  provider: "google-genai"     # google-genai, openai, or mock/offline
  model_vision: "gemini-3.8-flash"
  model_prose: "gemini-3.8-flash"
  model_table: "gemini-3.8-flash"
  model_fast: "gemini-3.8-flash"
  thinking_level: "medium"
  timeout_seconds: 60
  temperature: 0.1

markers:
  toc_start: "<!-- TOC34534 -->"
  toc_end: "<!-- /TOC34534 -->"

table_heuristics:
  max_columns_gfm: 6
  simple_table_check: true

segmentation:
  min_band_height_pt: 12.0
  column_gutter_threshold_pt: 18.0
