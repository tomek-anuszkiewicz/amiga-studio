# Global configuration for the modular PDF-to-Markdown pipeline

render:
  dpi: 300
  image_format: "png"
  padding_margin_ratio: 0.10  # 10% safety margin on raster fallback crops

paths:
  workspace_dir: "workspace"
  pages_dir: "workspace/01_preprocess"
  segments_dir: "workspace/02_page_segmentation"
  raw_stream_dir: "workspace/03_build_raw_stream"
  reduced_stream_dir: "workspace/04_stream_reduction"
  assets_dir: "workspace/03_build_raw_stream/assets"
  chapters_raw_dir: "workspace/05_chapter_partition"
  chapters_continuations_dir: "workspace/06_detect_continuations"
  chapters_tables_dir: "workspace/07_transform_tables"
  chapters_graphics_dir: "workspace/08_transform_graphics"
  chapters_formatted_dir: "workspace/09_transform_prose"
  markdown_raw_dir: "workspace/10_emit_markdown"
  markdown_linked_dir: "workspace/11_link_toc"
  canonical_markdown_dir: "workspace/12_refine_first_chapter_name"
  proofread_markdown_dir: "workspace/13_proofread_markdown"
  default_output_dir: "output_markdown"

llm:
  provider: "google-genai"     # google-genai, openai, or mock/offline
  model_vision: "gemini-3.8-flash"
  model_prose: "gemini-3.8-flash"
  model_table: "gemini-3.8-flash"
  model_fast: "gemini-3.8-flash"
  thinking_level: "medium"
  timeout_seconds: 60
  temperature: 0.1
  concurrency: 8

markers:
  toc_start: "<!-- TOC34534 -->"
  toc_end: "<!-- /TOC34534 -->"

table_heuristics:
  max_columns_gfm: 6
  simple_table_check: true

segmentation:
  min_band_height_pt: 12.0
  column_gutter_threshold_pt: 18.0
